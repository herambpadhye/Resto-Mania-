    // Update loading state with spinner only

    loadingDiv.innerHTML = `
        <div style="position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center;">
            <div style="margin-bottom:1.5rem; font-family:'Poppins',sans-serif; color:var(--first-color);">
                <h2 style="font-size:1.5rem; margin-bottom:0.5rem;">🍽️ Setting the table...</h2>
                <p style="color:var(--text-color); font-size:1rem;">Your culinary journey begins in moments</p>
            </div>
            <div style="width:40px; height:40px; border:3px solid #eee; border-top:3px solid var(--first-color); border-radius:50%; margin:0 auto; animation:spin 1s linear infinite;"></div>
        </div>
    `;

    // Add animation keyframes
    const style = document.createElement('style');
    style.textContent = `
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    `;
    document.head.appendChild(style);
    document.body.appendChild(loadingDiv);

    // Hide content initially
    mainContent.style.display = 'none';

    // Set timeout to 4 seconds
    const authTimeout = setTimeout(() => {
        loadingDiv.remove();
        window.location.replace('login.html?redirect=menu&error=timeout');
    }, 4000);

    // Check auth state
    onAuthStateChanged(auth, (user) => {
        clearTimeout(authTimeout); // Clear timeout since we got a response

        if (user) {
            // User is signed in
            globaluid = getCurrentUserUID();
            loadingDiv.remove();
            mainContent.style.display = 'block';
            initializeMenu();
            initializeBotpress();
        } else {
            // No user is signed in
            loadingDiv.remove();
            window.location.replace('login.html?redirect=menu');
        }
    }, (error) => {
        // Error handling
        console.error('Auth state check failed:', error);
        clearTimeout(authTimeout);
        loadingDiv.remove();
        window.location.replace('login.html?redirect=menu&error=auth');
    });

    function initializeMenu() {
        // Replace the theme toggle functionality with the consistent implementation
        const themeButton = document.getElementById('theme-toggle');
        const darkTheme = 'dark-theme';
        const iconTheme = 'light_mode';

        // Previously selected topic (if user selected)
        const selectedTheme = localStorage.getItem('selected-theme');
        const selectedIcon = localStorage.getItem('selected-icon');

        // We obtain the current theme that the interface has by validating the dark-theme class
        const getCurrentTheme = () => document.body.classList.contains(darkTheme) ? 'dark' : 'light';
        const getCurrentIcon = () => themeButton.textContent === 'light_mode' ? 'light_mode' : 'dark_mode';

        // We validate if the user previously chose a topic
        if (selectedTheme) {
            // If the validation is fulfilled, we ask what the issue was to know if we activated or deactivated the dark
            document.body.classList[selectedTheme === 'dark' ? 'add' : 'remove'](darkTheme);
            themeButton.textContent = selectedTheme === 'dark' ? 'light_mode' : 'dark_mode';
        }

        // Activate / deactivate the theme manually with the button
        themeButton.addEventListener('click', () => {
            // Add or remove the dark / icon theme
            document.body.classList.toggle(darkTheme);
            themeButton.textContent = document.body.classList.contains(darkTheme) ? 'light_mode' : 'dark_mode';
            
            // We save the theme and the current icon that the user chose
            localStorage.setItem('selected-theme', getCurrentTheme());
            localStorage.setItem('selected-icon', getCurrentIcon());
            
            // Update Botpress theme when dark mode changes
            if (window.botpress) {
                window.botpress.update({
                    configuration: {
                        themeMode: document.body.classList.contains(darkTheme) ? "dark" : "light"
                    }
                });
            }

        const searchInput = document.getElementById('searchInput');

        function filterMenuItems() {
          const searchTerm = searchInput.value.toLowerCase();

          document.querySelectorAll('.card').forEach(card => {
            const name = card.querySelector('.head').textContent.toLowerCase();
            const description = card.querySelector('.description').textContent.toLowerCase();
            const matchesSearch = name.includes(searchTerm) || description.includes(searchTerm);
            card.style.display = matchesSearch ? 'flex' : 'none';
          });
        }

        searchInput.addEventListener('input', filterMenuItems);

        const menuContainer = document.getElementById('menu-container');

        Object.entries(menuData).forEach(([key, section], sectionIndex) => {
          const sectionElement = document.createElement('section');
          sectionElement.className = 'menu-section';
          sectionElement.id = key;

          sectionElement.innerHTML = `
            <h2 class="section-title">${section.title}</h2>
            <div class="menu-grid">
              ${section.items.map((item, index) => `
                <div class="dish-wrapper">
                  <div class="card" onclick="toggleCard(this)">
                    <img class="img" src="${item.image}" alt="${item.name}">
                    <div class="textBox">
                      <span class="head">${item.name}</span>
                      <span class="description">${item.description}</span>
                      <span class="price">₹${item.price}</span>
                    </div>
                  </div>
                  <span class="dish-name">${item.name}</span>
                </div>
              `).join('')}
            </div>
          `;

          menuContainer.appendChild(sectionElement);
        });

        // Add touch event handling for mobile devices
        function handleCardInteraction(card, isMobile) {
          // Remove active state from all other cards
          document.querySelectorAll('.card').forEach(c => {
            if (c !== card) {
              c.classList.remove('active');
              const dishName = c.parentElement.querySelector('.dish-name');
              if (dishName) dishName.classList.remove('hidden');
            }
          });

          if (isMobile) {
            // Toggle active state on the clicked card
            const wasActive = card.classList.contains('active');
            card.classList.toggle('active');
            const dishName = card.parentElement.querySelector('.dish-name');
            if (dishName) {
              dishName.classList.toggle('hidden', !wasActive);
            }
          }
        }

        // Update the card click handler
        function toggleCard(card) {
          const isMobile = window.innerWidth <= 1023;
          handleCardInteraction(card, isMobile);
        }

        // Make toggleCard available globally
        window.toggleCard = toggleCard;

        // Add event listeners after creating the menu cards
        function addCardListeners() {
          const cards = document.querySelectorAll('.card');
          cards.forEach(card => {
            // Handle hover on desktop
            if (window.innerWidth > 1023) {
              card.addEventListener('mouseenter', () => handleCardInteraction(card, false));
              card.addEventListener('mouseleave', () => {
                card.classList.remove('active');
                const dishName = card.parentElement.querySelector('.dish-name');
                if (dishName) dishName.classList.remove('hidden');
              });
            }
          });
        }

        // Call addCardListeners after creating the menu
        setTimeout(addCardListeners, 0);

        // Update listeners on window resize
        let resizeTimer;
        window.addEventListener('resize', () => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(() => {
            document.querySelectorAll('.card').forEach(card => {
              card.classList.remove('active');
              const dishName = card.parentElement.querySelector('.dish-name');
              if (dishName) dishName.classList.remove('hidden');
            });
            addCardListeners();
          }, 250);
        });

        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('visible');
            }
          });
        }, { threshold: 0.1 });

        document.querySelectorAll('.section-title').forEach(title => {
          observer.observe(title);
        });

        document.querySelectorAll('.nav-links a').forEach(anchor => {
          anchor.addEventListener('click', function (e) {
            e.preventDefault();
            const targetId = this.getAttribute('href').substring(1);
            const targetSection = document.getElementById(targetId);
            
            if (targetSection) {
              targetSection.scrollIntoView({
                behavior: 'smooth',
                block: 'start'
              });
              
              // Update URL without jumping
              history.pushState(null, null, `#${targetId}`);
            }
          });
        });
    }
